name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "supabase/functions/_shared/emails.js", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # Cada 6 h: regenera las vistas previas de productos nuevos o editados (foto/nombre al compartir el link)
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Vista previa al compartir: una página por producto con su foto (Facebook/WhatsApp no leen el #)
      - name: Generar páginas de vista previa de productos
        run: pip install -q pillow && python3 tools/share_pages.py
      # CSS crítico: los estilos de la primera pantalla van dentro de la página y la hoja completa carga después
      # sin frenar el primer dibujo. Se genera en cada deploy (siempre coincide con styles.css) y se verifica con
      # capturas en 10 tamaños × 2 temas; si algo no coincide o falla, se publica con la hoja normal.
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: CSS crítico de la tienda
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1 \
            && node tools/critical.mjs --check || echo "Sin CSS crítico en este deploy (queda la hoja normal)"
      # Seguridad automática en TODAS las páginas, incluidas las que se agreguen en el futuro: política
      # CSP (solo corren scripts propios, con huellas recalculadas) y bloqueo del modo desarrollador.
      - name: Proteger todas las páginas (CSP + bloqueo del modo desarrollador)
        run: python3 tools/csp.py --fix && python3 tools/csp.py
      # Plantillas de email: el panel usa el mismo archivo que el envío real (vista previa idéntica)
      - name: Copiar generador de emails
        run: cp supabase/functions/_shared/emails.js site/assets/js/emails.mjs
      # Evita que el navegador use CSS/JS viejos: cada deploy agrega ?v=<commit> a sus enlaces
      - name: Versionar CSS y JS (cache busting)
        run: |
          v="${GITHUB_SHA::8}"
          find site -name '*.html' -print0 | xargs -0 sed -i -E "s#((src|href)=\"[^\"?]*assets/(css|js)/[^\"?]+\.(css|js))\"#\1?v=$v\"#g"
          find site -name '*.html' -print0 | xargs -0 sed -i "s#__BUILD__#$v · $(TZ=America/Argentina/Buenos_Aires date '+%d/%m %H:%M')#g"
          grep -rhoE 'assets/(css|js)/[^"]+' site --include='*.html' | sort -u
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
