<!doctype html>

  <script>try{var t=localStorage.getItem("exe-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <!-- Página autocontenida: GitHub Pages la sirve desde cualquier ruta, así que no depende de CSS relativos -->
  <style>
    :root { --bg: #fff; --fg: #333; --title: #000; --muted: #6b7280; --accent: #0084d6; --line: #e2e2e2; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0f16; --fg: #cbd5e1; --title: #f1f5f9; --muted: #94a3b8; --accent: #3d8ef0; --line: #1f2835; color-scheme: dark; } }
    :root[data-theme="dark"] { --bg: #0b0f16; --fg: #cbd5e1; --title: #f1f5f9; --muted: #94a3b8; --accent: #3d8ef0; --line: #1f2835; color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
      background: var(--bg); color: var(--fg); font-family: Lato, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    .code { font-size: clamp(4rem, 18vw, 8rem); font-weight: 800; line-height: 1; color: var(--accent); letter-spacing: -.04em; }
    h1 { margin: 10px 0 6px; font-size: 1.5rem; color: var(--title); }
    p { margin: 0 auto 22px; max-width: 40ch; color: var(--muted); }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a.btn { display: inline-block; padding: 12px 22px; border-radius: 15px; font-weight: 700; text-decoration: none; border: 1px solid var(--accent); }
    a.primary { background: var(--accent); color: #fff; }
    a.secondary { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>No encontramos esta página</h1>
    <p>Puede que el enlace esté mal escrito o que la página ya no exista. Te llevamos a la tienda:</p>
    <div class="actions">
      <a class="btn primary" id="home" href="/">Ir a la tienda</a>
      <a class="btn secondary" href="https://wa.me/5491130095254" target="_blank" rel="noopener">Escribinos por WhatsApp</a>
    </div>
  </main>
  <script>
    // En github.io el sitio vive en /EXE.COM.AR/; con dominio propio, en la raíz.
    var base = location.pathname.indexOf("/EXE.COM.AR/") === 0 ? "/EXE.COM.AR/" : "/";
    document.getElementById("home").href = base;
  </script>
</body>
