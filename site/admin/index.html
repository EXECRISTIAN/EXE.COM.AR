<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel | EXE</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/panel.css">
</head>
<body>
  <!-- Pantalla de acceso denegado / sin backend -->
  <main class="auth-page" id="gate">
    <div class="auth-card">
      <h1>Panel de administración</h1>
      <p class="notice info" id="gateMsg">Verificando permisos…</p>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <a class="btn btn-primary" href="../cuenta.html">Ingresar</a>
        <a class="btn btn-ghost" href="?demo=1" id="demoLink" hidden>Ver demo del diseño</a>
      </div>
    </div>
  </main>

  <!-- Panel (solo se muestra con permiso dashboard.access; los datos igual están protegidos por RLS en la base) -->
  <div class="admin" id="app" hidden>
    <aside class="sidebar">
      <a href="../index.html" class="logo"><span class="logo-mark">EXE</span></a>
      <nav class="side-nav" id="sideNav">
        <a href="#resumen" data-perm="dashboard.access" class="active">📊 Resumen</a>
        <a href="#pedidos" data-perm="orders.read">🧾 Pedidos</a>
        <a href="#productos" data-perm="products.read">📦 Productos y stock</a>
        <a href="#usuarios" data-perm="users.read">👥 Usuarios</a>
        <a href="#roles" data-perm="roles.manage">🛡️ Roles y permisos</a>
        <a href="#emails" data-perm="emails.manage">✉️ Emails automáticos</a>
      </nav>
    </aside>
    <main class="admin-main">
      <div class="admin-top">
        <h1 id="viewTitle" style="margin:0">Resumen</h1>
        <div><span id="me" style="color:var(--c3);margin-right:12px"></span><button class="btn btn-ghost" id="logout">Salir</button></div>
      </div>
      <p class="notice info" id="demoBanner" hidden>Modo demo: datos de ejemplo, sin conexión a la base de datos.</p>
      <div id="view"></div>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../assets/js/backend.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
