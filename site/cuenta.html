<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi cuenta | EXE</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.jpg" type="image/jpeg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/panel.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><img src="assets/img/logo.png" alt="EXE" width="106" height="55"></a>
      <nav class="nav" style="display:flex"><a href="index.html">← Volver a la tienda</a></nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card reveal in">
      <!-- Sin sesión -->
      <section id="guest">
        <h1>Mi cuenta</h1>
        <div class="tabs"><button class="active" data-tab="login">Ingresar</button><button data-tab="register">Crear cuenta</button></div>
        <p class="notice info" id="offline" hidden>El registro de usuarios todavía no está activado. Mientras tanto podés hacer tu pedido por WhatsApp desde el carrito.</p>
        <form class="form" id="loginForm">
          <label class="field">Email<input type="email" name="email" required autocomplete="email"></label>
          <label class="field">Contraseña<input type="password" name="password" required autocomplete="current-password"></label>
          <button class="btn btn-primary">Ingresar</button>
          <button type="button" class="link-btn" id="forgot">Olvidé mi contraseña</button>
        </form>
        <form class="form" id="registerForm" hidden>
          <label class="field">Nombre y apellido<input name="full_name" required autocomplete="name"></label>
          <label class="field">Teléfono (WhatsApp)<input name="phone" type="tel" autocomplete="tel"></label>
          <label class="field">Email<input type="email" name="email" required autocomplete="email"></label>
          <label class="field">Contraseña<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
          <button class="btn btn-primary">Crear cuenta</button>
        </form>
        <p class="notice" id="msg" hidden style="margin-top:14px"></p>
      </section>

      <!-- Con sesión -->
      <section id="logged" hidden>
        <h1>Hola, <span id="who"></span></h1>
        <p style="color:var(--c3)">Desde acá vas a ver tu historial de pedidos.</p>
        <div id="orders"></div>
        <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
          <a class="btn btn-primary" id="dashLink" href="admin/" hidden>Panel de administración</a>
          <button class="btn btn-outline" id="logout">Cerrar sesión</button>
        </div>
      </section>
    </div>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/backend.js"></script>
  <script src="assets/js/cuenta.js"></script>
</body>
</html>
